aid: fideo
name: Fideo
description: >-
  Fideo Intelligence is a Denver-based identity intelligence and fraud-prevention
  platform, spun out of FullContact in 2024 and backed by Foundry Group, Baird
  Capital, and Blue Note Ventures. Fideo turns fragmented personal identifiers —
  email, phone, SSN, name, postal address, IP address, and social handles — into
  real-time fraud and identity-verification signals drawn from an identity graph
  spanning billions of identities. Its two products, Verify (a single-call,
  real-time identity-verification and risk-scoring API that runs dozens of checks
  across breach, sanctions/watchlist, email, phone, location, device, and
  synthetic-identity dimensions) and Signals (modular identity-intelligence
  bundles that enrich existing fraud models), serve banks, credit unions,
  neobanks, fintechs, payments companies, and financial-crime and compliance
  teams for KYC, AML, onboarding, account-takeover, and payment-fraud use cases.
  The REST API is served at https://api.fideo.ai with bearer API-key
  authentication and JSON payloads, and is documented on a ReadMe developer hub.
