apis:
- name: Fideo Verify & Signals API
  description: >-
    Fideo's real-time REST API for identity verification, fraud risk scoring, and
    identity intelligence. Two endpoints share a common multi-field request
    schema: POST /verify runs a comprehensive suite of identity and risk checks
    and returns a 0–1 risk score with per-check results; POST /signals returns
    modular identity-intelligence bundles (person, email, phone, location, IP,
    professional, social, and economic signals). Bearer API-key authentication;
    JSON request and response bodies.
